name: Build LaTeX Documents

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile BaoCao_BaiTap (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: BaoCao_BaiTap.tex
          compiler: xelatex
          args: -interaction=nonstopmode -file-line-error -pdf

      - name: Compile CauHoi_OnThi (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CauHoi_OnThi.tex
          compiler: xelatex
          args: -interaction=nonstopmode -file-line-error -pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Assignment_PDFs
          path: |
            BaoCao_BaiTap.pdf
            CauHoi_OnThi.pdf
