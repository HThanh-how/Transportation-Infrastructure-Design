run_command - Chạy một lệnh trên hệ thống (PowerShell trên Windows). Lệnh này cần anh phê duyệt (Approve) trước khi chạy.
command_status - Kiểm tra trạng thái và đọc output của một lệnh đang chạy nền.
send_command_input - Gửi input vào một lệnh đang chạy (ví dụ nhập password, hoặc gõ lệnh trong REPL).
read_terminal - Đọc nội dung của một terminal đang hoạt động.
Liên quan đến File:

view_file, view_file_outline, view_code_item - Xem nội dung file.
write_to_file, replace_file_content, multi_replace_file_content - Tạo/sửa file.
list_dir, find_by_name, grep_search - Tìm kiếm file/thư mục.
Khác:

browser_subagent - Điều khiển trình duyệt.
search_web, read_url_content - Tìm kiếm web.
generate_image - Tạo hình ảnh.
notify_user, task_boundary - Giao tiếp và quản lý task.

